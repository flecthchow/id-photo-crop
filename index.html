<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>证件照裁剪</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --text:#1d2129; --muted:#6b7280; --border:#e3e5ea;
  --accent:#2563eb; --accent-text:#ffffff; --stage:#2b2e34; --chip:#f1f3f6; --field:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --panel:#1d2025; --text:#e6e8eb; --muted:#9aa1ab; --border:#30353c;
    --accent:#3b82f6; --accent-text:#ffffff; --stage:#0f1013; --chip:#272b31; --field:#24282e;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --panel:#1d2025; --text:#e6e8eb; --muted:#9aa1ab; --border:#30353c;
  --accent:#3b82f6; --accent-text:#ffffff; --stage:#0f1013; --chip:#272b31; --field:#24282e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:grid; grid-template-columns:1fr 360px; height:100vh; overflow:hidden;
}
.stage{position:relative; background:var(--stage); min-height:0; overflow:hidden}
#cv{display:block; touch-action:none; cursor:grab}
#cv.dragging{cursor:grabbing}
#empty{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; color:#c9cdd4; text-align:center; padding:16px;
}
#empty[hidden]{display:none}
#empty.over{outline:3px dashed var(--accent); outline-offset:-16px}
#empty .big{font-size:18px; color:#fff}
.panel{background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; padding:18px 18px 28px}
.panel header h1{font-size:20px; margin:0 0 2px}
.sub{margin:0 0 6px; color:var(--muted); font-size:12px}
section{border-top:1px solid var(--border); padding:14px 0 6px}
h2{font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.02em}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.muted{color:var(--muted); font-size:12px}
.hint{color:var(--muted); font-size:12px; margin:4px 0 8px}
.chips{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px}
.chip{
  border:1px solid var(--border); background:var(--chip); color:var(--text); border-radius:8px;
  padding:6px 2px; cursor:pointer; text-align:center; line-height:1.25; font:inherit;
}
.chip b{display:block; font-size:14px}
.chip small{color:var(--muted); font-size:11px}
.chip.on{border-color:var(--accent); background:var(--accent); color:var(--accent-text)}
.chip.on small{color:var(--accent-text); opacity:.85}
input[type=number],select{
  background:var(--field); color:var(--text); border:1px solid var(--border); border-radius:6px;
  padding:5px 6px; font:inherit; width:72px;
}
select{width:auto}
label{display:inline-flex; align-items:center; gap:6px}
.btn{
  border:1px solid var(--border); background:var(--chip); color:var(--text); border-radius:8px;
  padding:7px 12px; font:inherit; cursor:pointer;
}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent); width:100%; padding:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed}
.icon{padding:5px 9px}
.slider{display:grid; grid-template-columns:64px 1fr 48px; align-items:center; gap:8px; width:100%; margin-bottom:8px}
.slider span{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px}
input[type=range]{width:100%; accent-color:var(--accent)}
.swatches{display:flex; gap:6px; align-items:center}
.sw{width:26px; height:26px; border-radius:50%; border:2px solid var(--border); cursor:pointer; padding:0}
.sw.on{outline:2px solid var(--accent); outline-offset:2px}
input[type=color]{width:30px; height:28px; border:none; background:none; padding:0; cursor:pointer}
.out{font-variant-numeric:tabular-nums; background:var(--chip); border-radius:8px; padding:8px 10px; margin-bottom:4px}
.out b{font-size:15px}
#laypv{display:block; margin:4px auto 12px; max-width:100%; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,.25)}
#toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff;
  padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw;
}
#toast.show{opacity:.95}
@media (max-width:820px){
  body{display:block; height:auto; overflow:auto}
  .stage{height:62vh}
  .panel{border-left:none; padding:16px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div id="empty">
    <div class="big">把照片拖到这里</div>
    <div>或者 <button class="btn" id="pick2">选择照片</button>，也可以 Ctrl+V 粘贴</div>
    <div class="muted" style="color:#9aa1ab">照片只在本机浏览器里处理，不会上传</div>
  </div>
</div>

<aside class="panel">
  <header>
    <h1>证件照裁剪</h1>
    <p class="sub">按固定尺寸裁剪 · 支持排版打印</p>
  </header>

  <section>
    <h2>1 · 照片</h2>
    <div class="row">
      <button class="btn" id="pick">选择照片</button>
      <span class="muted" id="imginfo">未选择</span>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </section>

  <section>
    <h2>2 · 尺寸</h2>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label>宽 <input type="number" id="sw" step="0.1" min="1"></label>
      <span>×</span>
      <label>高 <input type="number" id="sh" step="0.1" min="1"></label>
      <select id="unit"><option value="mm">毫米</option><option value="px">像素</option></select>
      <button class="btn icon" id="swap" title="横竖互换">⇄</button>
    </div>
    <div class="row">
      <label>分辨率 <input type="number" id="dpi" value="300" min="72" max="1200"> DPI</label>
    </div>
    <div class="out" id="outinfo"></div>
    <p class="hint">具体尺寸、像素、文件大小要求以报名或办证方的说明为准。</p>
  </section>

  <section>
    <h2>3 · 调整</h2>
    <label class="slider">缩放 <input type="range" id="zoom" min="-1" max="3" step="0.01" value="0"><span id="zoomv">100%</span></label>
    <label class="slider">微调角度 <input type="range" id="rot" min="-15" max="15" step="0.1" value="0"><span id="rotv">0°</span></label>
    <div class="row">
      <button class="btn" id="rl">⟲ 左转90°</button>
      <button class="btn" id="rr">⟳ 右转90°</button>
      <button class="btn" id="reset">重置</button>
    </div>
    <div class="row">
      <span>空白填充色</span>
      <div class="swatches" id="swatches">
        <button class="sw on" data-c="#ffffff" style="background:#ffffff" title="白"></button>
        <button class="sw" data-c="#438edb" style="background:#438edb" title="蓝"></button>
        <button class="sw" data-c="#d9001b" style="background:#d9001b" title="红"></button>
        <input type="color" id="bgc" value="#ffffff" title="自定义颜色">
      </div>
    </div>
    <div class="row"><label><input type="checkbox" id="guides" checked> 显示人像参考线</label></div>
    <p class="hint">拖动照片调整位置；滚轮或双指缩放；方向键微移（按住 Shift 移得更多）。填充色只用于照片没盖住的空白处，不会替换原背景。</p>
  </section>

  <section>
    <h2>4 · 导出单张</h2>
    <div class="row">
      <select id="fmt"><option value="jpg">JPG</option><option value="png">PNG</option></select>
    </div>
    <label class="slider">JPG 质量 <input type="range" id="q" min="50" max="100" value="92"><span id="qv">92</span></label>
    <div class="row"><label>文件不超过 <input type="number" id="maxkb" placeholder="不限" min="5"> KB</label></div>
    <button class="btn primary" id="dl" disabled>下载照片</button>
  </section>

  <section>
    <h2>5 · 排版打印</h2>
    <div class="row">
      <select id="paper"></select>
      <span id="layinfo" class="muted"></span>
    </div>
    <canvas id="laypv" width="10" height="10"></canvas>
    <button class="btn wide" id="dlsheet" disabled>下载排版图</button>
    <p class="hint">按 100% 原始尺寸打印（不要勾选“适应页面”），沿灰线剪开即可。</p>
  </section>
</aside>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);

const PRESETS = [
  {name:'1寸',  w:25,  h:35,  note:'常用'},
  {name:'小1寸', w:22,  h:32,  note:'驾驶证'},
  {name:'大1寸', w:33,  h:48,  note:'护照'},
  {name:'2寸',  w:35,  h:49,  note:'常用'},
  {name:'小2寸', w:35,  h:45,  note:'签证'},
  {name:'大2寸', w:35,  h:53,  note:''},
  {name:'5寸',  w:89,  h:127, note:'3.5×5in'},
  {name:'6寸',  w:102, h:152, note:'4×6in'},
];
const PAPERS = [
  {name:'6寸相纸 (4×6in)', w:102, h:152},
  {name:'5寸相纸 (3.5×5in)', w:89, h:127},
  {name:'7寸相纸 (5×7in)', w:127, h:178},
  {name:'A4 纸', w:210, h:297},
];

const S = {
  img:null, url:null, name:'photo',
  cx:0, cy:0, cw:1, fitCw:1,          // crop center & crop width, in image pixels
  rot90:0, rotFine:0,
  bg:'#ffffff', guides:true,
  size:{w:25, h:35, unit:'mm'}, preset:0, dpi:300,
};

/* ---------- size helpers ---------- */
const aspect = () => S.size.w / S.size.h;
const rad = () => (S.rot90 + S.rotFine) * Math.PI / 180;
function outPx(){
  const {w,h,unit} = S.size;
  if (unit === 'px') return {w:Math.max(1,Math.round(w)), h:Math.max(1,Math.round(h))};
  return {w:Math.max(1,Math.round(w/25.4*S.dpi)), h:Math.max(1,Math.round(h/25.4*S.dpi))};
}
function photoMM(){
  const {w,h,unit} = S.size;
  return unit === 'mm' ? {w,h} : {w:w/S.dpi*25.4, h:h/S.dpi*25.4};
}
function invRot(x, y){
  const t = rad(), c = Math.cos(t), s = Math.sin(t);
  return [x*c + y*s, -x*s + y*c];
}
function computeFitCw(){
  const iw = S.img.naturalWidth, ih = S.img.naturalHeight;
  const sideways = ((S.rot90 % 180) + 180) % 180 === 90;
  const w = sideways ? ih : iw, h = sideways ? iw : ih;
  return (w / h > aspect()) ? h * aspect() : w;
}

/* ---------- stage ---------- */
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize(){
  const r = stage.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  draw();
}
new ResizeObserver(resize).observe(stage);

function frame(){
  const pad = Math.max(24, Math.min(W, H) * 0.08);
  const aw = Math.max(10, W - 2*pad), ah = Math.max(10, H - 2*pad), a = aspect();
  let fw, fh;
  if (aw / ah > a) { fh = ah; fw = fh * a; } else { fw = aw; fh = fw / a; }
  return {x:(W-fw)/2, y:(H-fh)/2, w:fw, h:fh};
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if (!S.img) return;
  const f = frame(), k = f.w / S.cw;
  ctx.fillStyle = S.bg; ctx.fillRect(f.x, f.y, f.w, f.h);
  ctx.save();
  ctx.translate(f.x + f.w/2, f.y + f.h/2); ctx.scale(k, k); ctx.rotate(rad()); ctx.translate(-S.cx, -S.cy);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(S.img, 0, 0);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.rect(f.x, f.y, f.w, f.h); ctx.fill('evenodd');
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.strokeRect(f.x, f.y, f.w, f.h);
  if (S.guides) drawGuides(f);
  schedulePreview();
}

function drawGuides(f){
  const cx = f.x + f.w/2;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(cx, f.y); ctx.lineTo(cx, f.y + f.h); ctx.stroke();
  // head outline: top of head ~8% from top, chin ~72%
  const top = f.y + f.h*0.08, chin = f.y + f.h*0.72;
  ctx.beginPath(); ctx.ellipse(cx, (top+chin)/2, f.w*0.27, (chin-top)/2, 0, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]); ctx.strokeStyle = 'rgba(255,214,10,0.9)';
  for (const y of [top, chin]) { ctx.beginPath(); ctx.moveTo(f.x, y); ctx.lineTo(f.x + f.w*0.12, y); ctx.moveTo(f.x + f.w*0.88, y); ctx.lineTo(f.x + f.w, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,214,10,0.95)'; ctx.font = '11px sans-serif';
  if (f.w > 140) { ctx.fillText('头顶', f.x + f.w + 6, top + 4); ctx.fillText('下巴', f.x + f.w + 6, chin + 4); }
  ctx.restore();
}

/* ---------- interaction ---------- */
function clampCw(cw){ return Math.min(S.fitCw * 2, Math.max(S.fitCw / 8, cw)); }
function pan(dx, dy){
  const k = frame().w / S.cw, [ux, uy] = invRot(dx, dy);
  S.cx -= ux / k; S.cy -= uy / k; draw();
}
function zoomAt(factor, qx, qy){   // q = screen offset from frame center
  const f = frame(), k = f.w / S.cw;
  const ncw = clampCw(S.cw / factor), k2 = f.w / ncw;
  const [ux, uy] = invRot(qx, qy);
  S.cx += ux/k - ux/k2; S.cy += uy/k - uy/k2; S.cw = ncw;
  syncZoom(); draw();
}
function zoomAtClient(factor, clientX, clientY){
  const r = cv.getBoundingClientRect(), f = frame();
  zoomAt(factor, clientX - r.left - (f.x + f.w/2), clientY - r.top - (f.y + f.h/2));
}
cv.addEventListener('wheel', e => {
  if (!S.img) return; e.preventDefault();
  zoomAtClient(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
}, {passive:false});

const ptrs = new Map();
cv.addEventListener('pointerdown', e => {
  if (!S.img) return;
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = {x:e.clientX, y:e.clientY};
  if (ptrs.size === 1) pan(cur.x - prev.x, cur.y - prev.y);
  else if (ptrs.size === 2) {
    const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x-other.x, prev.y-other.y), d1 = Math.hypot(cur.x-other.x, cur.y-other.y);
    pan((cur.x - prev.x)/2, (cur.y - prev.y)/2);
    if (d0 > 0) zoomAtClient(d1/d0, (cur.x+other.x)/2, (cur.y+other.y)/2);
  }
  ptrs.set(e.pointerId, cur);
});
const endPtr = e => { ptrs.delete(e.pointerId); if (!ptrs.size) cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);

window.addEventListener('keydown', e => {
  if (!S.img || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const step = e.shiftKey ? 10 : 1;
  const m = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]}[e.key];
  if (m) { e.preventDefault(); pan(m[0], m[1]); }
});

/* ---------- loading ---------- */
function loadFile(file){
  if (!file || !file.type.startsWith('image/')) { toast('请选择图片文件'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    if (S.url) URL.revokeObjectURL(S.url);
    S.img = img; S.url = url; S.name = (file.name || 'photo').replace(/\.[^.]+$/, '') || 'photo';
    S.rot90 = 0; S.rotFine = 0; $('#rot').value = 0; $('#rotv').textContent = '0°';
    $('#empty').hidden = true;
    $('#imginfo').textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
    fit(); updateUI();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('无法读取这张图片（HEIC 等格式请先转成 JPG）'); };
  img.src = url;
}
function fit(){
  if (!S.img) return;
  S.fitCw = computeFitCw(); S.cw = S.fitCw;
  S.cx = S.img.naturalWidth/2; S.cy = S.img.naturalHeight/2;
  syncZoom(); draw();
}
const fileInput = $('#file');
$('#pick').onclick = $('#pick2').onclick = () => fileInput.click();
fileInput.onchange = () => { loadFile(fileInput.files[0]); fileInput.value = ''; };
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('#empty').classList.add('over'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('#empty').classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

/* ---------- controls ---------- */
const chips = $('#chips');
PRESETS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.innerHTML = `<b>${p.name}</b><small>${p.w}×${p.h}</small>`;
  b.title = `${p.name} ${p.w}×${p.h} 毫米${p.note ? '（' + p.note + '）' : ''}`;
  b.onclick = () => { S.preset = i; S.size = {w:p.w, h:p.h, unit:'mm'}; sizeChanged(); };
  chips.appendChild(b);
});
function sizeChanged(){
  if (S.img) {
    const z = S.fitCw / S.cw;
    S.fitCw = computeFitCw(); S.cw = clampCw(S.fitCw / z);
    syncZoom();
  }
  updateUI(); draw();
}
function readCustom(){
  const w = parseFloat($('#sw').value), h = parseFloat($('#sh').value);
  if (!(w > 0 && h > 0)) return;
  S.size = {w, h, unit:$('#unit').value}; S.preset = -1; sizeChanged();
}
$('#sw').oninput = $('#sh').oninput = readCustom;
$('#unit').onchange = () => {
  const u = $('#unit').value, {w,h,unit} = S.size;
  if (u === unit) return;
  const f = u === 'px' ? S.dpi/25.4 : 25.4/S.dpi;
  S.size = {w: round(w*f, u), h: round(h*f, u), unit:u}; S.preset = -1; sizeChanged();
};
const round = (v, u) => u === 'px' ? Math.round(v) : Math.round(v*10)/10;
$('#swap').onclick = () => {
  const {w,h,unit} = S.size; S.size = {w:h, h:w, unit};
  S.preset = PRESETS.findIndex(p => unit === 'mm' && p.w === h && p.h === w); sizeChanged();
};
$('#dpi').oninput = () => {
  const v = parseInt($('#dpi').value, 10);
  if (v >= 30 && v <= 2400) { S.dpi = v; updateUI(); schedulePreview(); }
};

function syncZoom(){
  const z = S.fitCw / S.cw;
  $('#zoom').value = Math.log2(z); $('#zoomv').textContent = Math.round(z*100) + '%';
}
$('#zoom').oninput = () => {
  if (!S.img) return;
  const z = Math.pow(2, parseFloat($('#zoom').value));
  zoomAt((S.fitCw / z) ? S.cw / (S.fitCw / z) : 1, 0, 0);
};
$('#rot').oninput = () => { S.rotFine = parseFloat($('#rot').value); $('#rotv').textContent = S.rotFine.toFixed(1).replace('.0','') + '°'; draw(); };
$('#rl').onclick = () => { S.rot90 -= 90; if (S.img) fit(); };
$('#rr').onclick = () => { S.rot90 += 90; if (S.img) fit(); };
$('#reset').onclick = () => { S.rot90 = 0; S.rotFine = 0; $('#rot').value = 0; $('#rotv').textContent = '0°'; fit(); };
$('#guides').onchange = () => { S.guides = $('#guides').checked; draw(); };

function setBg(c){
  S.bg = c; $('#bgc').value = c;
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === c));
  draw();
}
document.querySelectorAll('.sw').forEach(b => b.onclick = () => setBg(b.dataset.c));
$('#bgc').oninput = () => setBg($('#bgc').value);

$('#q').oninput = () => $('#qv').textContent = $('#q').value;
$('#fmt').onchange = () => {
  const png = $('#fmt').value === 'png';
  $('#q').disabled = png; $('#maxkb').disabled = png;
};

PAPERS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.name; $('#paper').appendChild(o); });
$('#paper').onchange = () => { updateUI(); schedulePreview(); };

function updateUI(){
  document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('on', i === S.preset));
  const {w,h,unit} = S.size;
  if (document.activeElement !== $('#sw')) $('#sw').value = w;
  if (document.activeElement !== $('#sh')) $('#sh').value = h;
  $('#unit').value = unit;
  $('#sw').step = $('#sh').step = unit === 'px' ? 1 : 0.1;
  const o = outPx(), mm = photoMM();
  const name = S.preset >= 0 ? PRESETS[S.preset].name + ' · ' : '自定义 · ';
  $('#outinfo').innerHTML = `${name}${fmtN(mm.w)}×${fmtN(mm.h)} 毫米<br>输出 <b>${o.w} × ${o.h}</b> 像素 @ ${S.dpi} DPI`;
  const L = layoutPlan(), n = L.cols * L.rows;
  $('#layinfo').textContent = n ? `每张可排 ${n} 张（${L.cols}×${L.rows}）` : '照片比纸大，放不下';
  $('#dl').disabled = !S.img;
  $('#dlsheet').disabled = !S.img || !n;
}
const fmtN = v => (Math.round(v*10)/10).toString();

/* ---------- rendering output ---------- */
function renderOut(w, h){
  const scale = w / S.cw;
  let m = 1; while (scale * m * 2 <= 1 && m < 32) m *= 2;   // render bigger, then halve for smoother downscaling
  let c = document.createElement('canvas'); c.width = w*m; c.height = h*m;
  const x = c.getContext('2d');
  x.fillStyle = S.bg; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.translate(c.width/2, c.height/2); x.scale(scale*m, scale*m); x.rotate(rad()); x.translate(-S.cx, -S.cy);
  x.drawImage(S.img, 0, 0);
  while (m > 1) {
    const n = document.createElement('canvas'); n.width = c.width/2; n.height = c.height/2;
    const nx = n.getContext('2d'); nx.imageSmoothingQuality = 'high';
    nx.drawImage(c, 0, 0, n.width, n.height); c = n; m /= 2;
  }
  return c;
}

function layoutPlan(){
  const p = PAPERS[+$('#paper').value || 0], ph = photoMM(), gap = 2, margin = 3;
  const fitN = (PW, PH) => ({
    cols: Math.max(0, Math.floor((PW - 2*margin + gap) / (ph.w + gap))),
    rows: Math.max(0, Math.floor((PH - 2*margin + gap) / (ph.h + gap))), PW, PH, gap, ph,
  });
  const a = fitN(p.w, p.h), b = fitN(p.h, p.w);
  return (b.cols*b.rows > a.cols*a.rows) ? b : a;
}
// draws the sheet onto ctx where 1 mm = pxPerMM pixels
function drawSheet(x, L, pxPerMM, photo){
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, Math.round(L.PW*pxPerMM), Math.round(L.PH*pxPerMM));
  const tw = L.cols*L.ph.w + (L.cols-1)*L.gap, th = L.rows*L.ph.h + (L.rows-1)*L.gap;
  const x0 = (L.PW - tw)/2, y0 = (L.PH - th)/2;
  x.strokeStyle = '#b5b5b5'; x.lineWidth = Math.max(1, pxPerMM*0.1);
  for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) {
    const px = Math.round((x0 + c*(L.ph.w + L.gap))*pxPerMM), py = Math.round((y0 + r*(L.ph.h + L.gap))*pxPerMM);
    const pw = Math.round(L.ph.w*pxPerMM), ph = Math.round(L.ph.h*pxPerMM);
    x.drawImage(photo, px, py, pw, ph);
    x.strokeRect(px - x.lineWidth/2, py - x.lineWidth/2, pw + x.lineWidth, ph + x.lineWidth);
  }
}

let pvTimer = 0;
function schedulePreview(){ clearTimeout(pvTimer); pvTimer = setTimeout(drawPreview, 180); }
function drawPreview(){
  const c = $('#laypv'), L = layoutPlan();
  const maxW = 300, maxH = 260, s = Math.min(maxW / L.PW, maxH / L.PH);
  c.width = Math.round(L.PW*s); c.height = Math.round(L.PH*s);
  const x = c.getContext('2d');
  if (!S.img || !(L.cols*L.rows)) {
    x.fillStyle = '#ffffff'; x.fillRect(0,0,c.width,c.height);
    x.fillStyle = '#9aa1ab'; x.font = '13px sans-serif'; x.textAlign = 'center';
    x.fillText(S.img ? '放不下' : '选择照片后显示排版预览', c.width/2, c.height/2);
    return;
  }
  const o = outPx(), k = Math.min(1, 160 / Math.max(o.w, o.h));
  drawSheet(x, L, s, renderOut(Math.max(1, Math.round(o.w*k)), Math.max(1, Math.round(o.h*k))));
}

/* ---------- encoding & DPI metadata ---------- */
const blobOf = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function encode(c){
  const png = $('#fmt').value === 'png', type = png ? 'image/png' : 'image/jpeg';
  let q = +$('#q').value / 100, b = await blobOf(c, type, q), warn = '';
  const max = parseFloat($('#maxkb').value);
  if (!png && max > 0) {
    while (b.size > max*1024 && q > 0.1) { q = Math.round((q - 0.05)*100)/100; b = await blobOf(c, type, q); }
    if (b.size > max*1024) warn = `已压到最低质量仍有 ${Math.ceil(b.size/1024)} KB，请减小尺寸或分辨率`;
  }
  return {blob: await setDpi(b, S.dpi), q, warn, ext: png ? 'png' : 'jpg'};
}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes){ let c = 0xFFFFFFFF; for (const b of bytes) c = CRC[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function setDpi(blob, dpi){
  const u = new Uint8Array(await blob.arrayBuffer());
  dpi = Math.min(65535, Math.max(1, Math.round(dpi)));
  // JPEG with JFIF APP0 header
  if (u[0]===0xFF && u[1]===0xD8 && u[2]===0xFF && u[3]===0xE0 && u[6]===0x4A && u[7]===0x46 && u[8]===0x49 && u[9]===0x46 && u[10]===0) {
    u[13] = 1; u[14] = dpi >> 8; u[15] = dpi & 255; u[16] = dpi >> 8; u[17] = dpi & 255;
    return new Blob([u], {type: blob.type});
  }
  // PNG: set or insert pHYs
  if (u[0]===0x89 && u[1]===0x50 && u[2]===0x4E && u[3]===0x47) {
    const ppm = Math.round(dpi / 0.0254), dv = new DataView(u.buffer);
    for (let p = 8; p + 8 <= u.length; ) {
      const len = dv.getUint32(p), type = String.fromCharCode(...u.subarray(p+4, p+8));
      if (type === 'pHYs') { dv.setUint32(p+8, ppm); dv.setUint32(p+12, ppm); u[p+16] = 1; dv.setUint32(p+17, crc32(u.subarray(p+4, p+17))); return new Blob([u], {type:'image/png'}); }
      if (type === 'IDAT' || type === 'IEND') break;
      p += 12 + len;
    }
    const ch = new Uint8Array(21), cd = new DataView(ch.buffer);
    cd.setUint32(0, 9); ch.set([0x70,0x48,0x59,0x73], 4); cd.setUint32(8, ppm); cd.setUint32(12, ppm); ch[16] = 1;
    cd.setUint32(17, crc32(ch.subarray(4, 17)));
    return new Blob([u.subarray(0, 33), ch, u.subarray(33)], {type:'image/png'});
  }
  return blob;
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function sizeLabel(){ return S.preset >= 0 ? PRESETS[S.preset].name : `${fmtN(S.size.w)}x${fmtN(S.size.h)}${S.size.unit}`; }

$('#dl').onclick = async () => {
  if (!S.img) return;
  const o = outPx(), r = await encode(renderOut(o.w, o.h));
  download(r.blob, `${S.name}_${sizeLabel()}_${o.w}x${o.h}.${r.ext}`);
  toast(r.warn || `已导出 ${o.w}×${o.h} 像素，${Math.ceil(r.blob.size/1024)} KB${r.ext === 'jpg' ? '，质量 ' + Math.round(r.q*100) : ''}`);
};
$('#dlsheet').onclick = async () => {
  if (!S.img) return;
  const L = layoutPlan(); if (!(L.cols*L.rows)) return;
  const pxPerMM = S.dpi / 25.4, o = outPx();
  const c = document.createElement('canvas');
  c.width = Math.round(L.PW*pxPerMM); c.height = Math.round(L.PH*pxPerMM);
  drawSheet(c.getContext('2d'), L, pxPerMM, renderOut(o.w, o.h));
  const r = await encode(c);
  const paper = PAPERS[+$('#paper').value].name.split(' ')[0];
  download(r.blob, `${S.name}_${sizeLabel()}_${paper}排版_${L.cols*L.rows}张.${r.ext}`);
  toast(`已导出排版图 ${c.width}×${c.height} 像素，共 ${L.cols*L.rows} 张`);
};

let toastTimer = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

updateUI(); drawPreview();
</script>
</body>
</html>
